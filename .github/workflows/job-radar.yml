name: Mollix Job Radar

on:
  schedule:
    # Every ten minutes, offset from the busiest minute at the start of the hour.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mollix-job-radar-state
  cancel-in-progress: false

jobs:
  radar:
    # Manual runs from another branch must not send with a different state file.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out latest default branch and state
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Offline dry run
        run: python -m jobradar check --fixtures tests/fixtures --now 2026-09-21T12:00:00+00:00 --json

      - name: Send new matching projects
        id: radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobradar run

      - name: Persist state even after a partial failure
        if: ${{ always() && (steps.radar.outcome == 'success' || steps.radar.outcome == 'failure') }}
        env:
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/state.json
          if git diff --cached --quiet -- data/state.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update job radar state [skip ci]' -- data/state.json
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$STATE_BRANCH"; then
              exit 0
            fi
            # Never force-push or overwrite a concurrent state update.
            git pull --rebase origin "$STATE_BRANCH"
            sleep "$attempt"
          done
          echo '::error::Could not persist state. Pause scheduled runs and restore the state artifact before resuming.'
          exit 1

      - name: Keep state for recovery after a failed job
        if: ${{ failure() && (steps.radar.outcome == 'success' || steps.radar.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: job-radar-state-${{ github.run_id }}
          path: data/state.json
          retention-days: 7
          if-no-files-found: error
